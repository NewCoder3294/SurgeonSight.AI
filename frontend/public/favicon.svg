<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1E40AF"/>
    </linearGradient>
    <linearGradient id="scalpelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64748B"/>
      <stop offset="100%" style="stop-color:#94A3B8"/>
    </linearGradient>
  </defs>
  
  <!-- Eye outline -->
  <ellipse cx="28" cy="32" rx="22" ry="14" fill="none" stroke="url(#eyeGrad)" stroke-width="3"/>
  
  <!-- Iris -->
  <circle cx="28" cy="32" r="10" fill="url(#eyeGrad)"/>
  
  <!-- Pupil -->
  <circle cx="28" cy="32" r="4" fill="#1E293B"/>
  
  <!-- Light reflection -->
  <circle cx="30" cy="30" r="2" fill="white" opacity="0.8"/>
  
  <!-- Scalpel blade -->
  <path d="M44 16 L58 44 L54 46 L42 20 Z" fill="url(#scalpelGrad)" stroke="#475569" stroke-width="1"/>
  
  <!-- Scalpel handle -->
  <rect x="40" y="12" width="6" height="10" rx="1" fill="#64748B" stroke="#475569" stroke-width="1"/>
  
  <!-- Tech circuit lines around eye -->
  <g stroke="#3B82F6" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M4 32 L10 32"/>
    <path d="M8 26 L14 28"/>
    <path d="M8 38 L14 36"/>
    <circle cx="4" cy="32" r="1.5" fill="#3B82F6"/>
    <circle cx="8" cy="26" r="1.5" fill="#3B82F6"/>
    <circle cx="8" cy="38" r="1.5" fill="#3B82F6"/>
  </g>
</svg>
